<!doctype html>
<!--
  dsh-cua-preview overlay UI.

  Design goals:
  - as little chrome as possible: a status dot, one caption, one thumbnail;
  - native macOS glass comes from the BrowserWindow `vibrancy: 'hud'` material,
    this file only adds a light tint, rounding and typography;
  - the whole card is a window-drag region (`-webkit-app-region: drag`), so the
    user can move it with the mouse or with macOS three-finger drag;
  - the two <img> layers are double-buffered by renderer.js to cross-fade frames
    without flicker.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'self'" />
<title>DSH Computer Use Preview</title>
<style>
  :root {
    --accent: #4da3ff;
    --text: rgba(255, 255, 255, 0.96);
    --muted: rgba(235, 240, 248, 0.58);
    --line: rgba(255, 255, 255, 0.14);
    --fill: rgba(15, 17, 21, 0.58);
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }
  /* The card: rounded translucent panel above the vibrancy material. */
  #card {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: var(--fill);
    border: 1px solid var(--line);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      0 24px 60px rgba(0, 0, 0, 0.36),
      0 2px 10px rgba(0, 0, 0, 0.20);
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(5px) scale(0.985);
    transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    -webkit-app-region: drag;
  }
  #card.visible { opacity: 1; transform: translateY(0) scale(1); }

  /* Header: pulsing status dot, one-line title, app name on the right. */
  #bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 13px 9px;
    -webkit-app-region: drag;
  }
  #dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(77, 163, 255, 0.85);
    animation: glow 1.8s ease-in-out infinite;
    flex: none;
  }
  @keyframes glow {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(77, 163, 255, 0.55); }
    50% { opacity: 0.62; box-shadow: 0 0 14px rgba(77, 163, 255, 0.95); }
  }
  #title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1px;
    color: var(--text);
    white-space: nowrap;
  }
  #app {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 120px;
    text-align: right;
  }

  /* Thumbnail area: two stacked layers for cross-fading captures. */
  #view {
    position: relative;
    flex: 1;
    min-height: 0;
    margin: 0 9px 9px;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 160ms ease;
    display: block;
  }
  .layer.front { opacity: 1; }
  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.30);
    font-size: 10.5px;
    letter-spacing: 0.2px;
  }
  #view.has-frame #placeholder { display: none; }

  /* Caption fades in for a couple of seconds on each action. */
  #caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 10px 7px;
    font-size: 9.5px;
    color: rgba(255, 255, 255, 0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.52), rgba(0, 0, 0, 0));
    opacity: 0;
    transition: opacity 240ms ease;
  }
  #caption.show { opacity: 1; }
</style>
</head>
<body>
  <div id="card">
    <div id="bar">
      <span id="dot"></span>
      <span id="title">正在操作你的电脑</span>
      <span id="app"></span>
    </div>
    <div id="view">
      <img class="layer" id="frameA" alt="" />
      <img class="layer" id="frameB" alt="" />
      <div id="placeholder">等待屏幕观察…</div>
      <div id="caption"></div>
    </div>
  </div>
<script src="renderer.js"></script>
</body>
</html>
